<text x="50" y="795" font-family="DejaVu Sans, Arial, sans-serif" font-size="12.5" font-weight="normal" text-anchor="start" fill="#222">Kaikki aiheet ovat /hold/-nimiavaruudessa (esim. /hold/state). recorder tallentaa todellisen tilan (truth), maailmamallin, päätökset ja toimilaitteiden tilan CSV-lokiin todentamista varten.</text>
<text x="50" y="818" font-family="DejaVu Sans, Arial, sans-serif" font-size="12.5" font-weight="normal" text-anchor="start" fill="#222">Aikapohja: Webotsin simulaatioaika actuator_state-viestissä; prosessiaika = simulaatioaika × 600. Katkoviiva = mitattu toimilaitteiden tila.</text>
