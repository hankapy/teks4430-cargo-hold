<text x="801" y="388" font-family="DejaVu Sans, Arial, sans-serif" font-size="12.5" font-weight="normal" text-anchor="start" fill="#222">(ristiriita: asetusarvo 15 %)</text>
<text x="769" y="408" font-family="DejaVu Sans, Arial, sans-serif" font-size="12.5" font-weight="normal" text-anchor="start" fill="#222">3  itsekuumeneminen → kiinni</text>
<text x="769" y="428" font-family="DejaVu Sans, Arial, sans-serif" font-size="12.5" font-weight="normal" text-anchor="start" fill="#222">4  muuten valvonta</text>
